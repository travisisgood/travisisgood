<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>travisisgood</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Geist', system-ui, sans-serif;
            background: linear-gradient(135deg, #211c25, #141216);
            color: #eeebf0;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Ensures content fills the screen */
            overflow: hidden; /* Prevents unwanted scrolling */
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease-in forwards;
            padding-bottom: 20vh; /* Raises content higher */
        }
        h1 {
            font-size: 56px; /* Large title */
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 10px;
            text-transform: lowercase;
        }
        .divider {
            width: 70%; /* Slightly shorter than buttons */
            max-width: 250px; /* Ensures it's shorter on wider screens */
            height: 3px;
            background-color: rgba(255, 255, 255, 0.18);
            margin: 20px 0;
            border-radius: 2px;
        }
        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 80%;
            max-width: 300px;
            padding: 20px;
            margin: 15px;
            text-align: center;
            background-color: #467c61;
            color: #f4f2f5;
            text-decoration: none;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            border-radius: 10px;
            transition: background-color 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
            text-transform: lowercase;
        }
        .button {
            flex-direction: column;
            gap: 2px;
        }
        .button .kind {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: .14em;
            opacity: .7;
        }
        .button:hover {
            background-color: #508b6d;
            transform: scale(1.05);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }
        .button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h1>my stuff</h1>
        <div class="divider"></div>
        <a href="/fingerball/" class="button"><span class="kind">music</span>fingerball</a>
        <a href="https://store.steampowered.com/app/2947110/Core_Descent/" target="_blank" class="button"><span class="kind">game</span>core descent</a>
        <a href="/di-denoiser/" class="button"><span class="kind">audio plugin</span>di denoiser</a>
    </div>
</body>
</html>
